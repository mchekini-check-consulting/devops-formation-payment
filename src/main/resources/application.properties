# Application - Configuration commune
spring.application.name=payment-service

# JPA - Configuration commune
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging - Niveau par défaut
logging.level.com.ecommerce.paymentservice=INFO

# le profil dev par défaut
spring.profiles.active=dev

# ou avec VarEnv SPRING_PROFILES_ACTIVE=dev


# Swagger/OpenAPI Configuration
# Swagger/OpenAPI Configuration - Version corrigée
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.ecommerce.paymentservice
springdoc.paths-to-match=/api/**




# ─── Logging ───────────────────────────────────────────────────────────────────
# Niveau racine (surchargeable par la variable d'environnement LOG_LEVEL)
logging.level.root=${LOG_LEVEL:DEBUG}
# logback-spring.xml gère le format ; Spring ne doit pas ajouter de pattern texte
logging.pattern.console=

# ─── OpenTelemetry – configuration de base (commune à tous les profils) ────────
otel.service.name=payment-service
otel.resource.attributes=service.name=payment-service,service.version=1.0.0
otel.propagators=tracecontext,baggage
# Exporteur OTLP activé dans tous les profils.
# L'endpoint est surchargé par chaque profil (Jaeger en dev, Azure Monitor en prod).
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none
# Protocole gRPC (défaut OTLP)
otel.exporter.otlp.protocol=grpc

# ─── Actuator (health check Kubernetes) ────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never