# Application - Configuration commune
spring.application.name=payment-service

# JPA - Configuration commune
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging - Niveau par défaut
logging.level.com.ecommerce.paymentservice=INFO

# le profil dev par défaut
spring.profiles.active=dev

# ou avec VarEnv SPRING_PROFILES_ACTIVE=dev


# Swagger/OpenAPI Configuration
# Swagger/OpenAPI Configuration - Version corrigée
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.ecommerce.paymentservice
springdoc.paths-to-match=/api/**




# ─── Logging ───────────────────────────────────────────────────────────────────
# Niveau racine (surchargeable par la variable d'environnement LOG_LEVEL)
logging.level.root=${LOG_LEVEL:DEBUG}
# logback-spring.xml gère le format ; Spring ne doit pas ajouter de pattern texte
logging.pattern.console=


# ─── Actuator ─────────────────────────────────────────────────────────────────
# Health check is now served by /api/health (HealthController)
management.endpoints.web.exposure.include=info
management.endpoint.health.enabled=false