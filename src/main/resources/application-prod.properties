# Serveur
server.port=8082

# PostgreSQL - Base en production (à adapter avec variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Prod (ne pas afficher les requêtes)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging - Prod (erreurs seulement)
logging.level.com.ecommerce.paymentservice=WARN
logging.level.org.springframework.web=ERROR

# Simulation paiement (80% succès)
payment.simulation.success-probability=0.8



# Environnement
app.env=prod


# ─── Profil : production ────────────────────────────────────────────────────────
# L'agent applicationinsights-agent.jar est attaché via JAVA_TOOL_OPTIONS
# dans le Dockerfile de prod. Il intercepte l'exporter OTLP et redirige
# les traces vers Azure Monitor via la connection string.
#
# La propriété otel.exporter.otlp.endpoint n'est PAS définie ici :
# l'agent Application Insights court-circuite l'exporteur OTLP standard
# et utilise son propre canal vers Azure Monitor.

app.env=prod

# Connection string fournie par variable d'environnement (obligatoire)
# Format : InstrumentationKey=<uuid>;IngestionEndpoint=https://<region>.in.applicationinsights.azure.com/
applicationinsights.connection.string=${APPLICATIONINSIGHTS_CONNECTION_STRING}

logging.level.root=INFO