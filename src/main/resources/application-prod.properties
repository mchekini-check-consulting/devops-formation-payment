# Serveur
server.port=8082

# PostgreSQL - Base en production (à adapter avec variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — alignement avec PgCat (server_lifetime = 300s)
# max-lifetime doit être < server_lifetime de PgCat pour recycler AVANT que PgCat ferme la connexion
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA - Prod (ne pas afficher les requêtes)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging - Prod (minimum de bruit)
logging.level.com.ecommerce.paymentservice=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR

# Simulation paiement (80% succès)
payment.simulation.success-probability=0.8



# Environnement
app.env=prod


# ─── Profil : production ────────────────────────────────────────────────────────
# L'agent applicationinsights-agent.jar est attaché via JAVA_TOOL_OPTIONS
# dans le Dockerfile de prod. Il intercepte l'exporter OTLP et redirige
# les traces vers Azure Monitor via la connection string.
#
# La propriété otel.exporter.otlp.endpoint n'est PAS définie ici :
# l'agent Application Insights court-circuite l'exporteur OTLP standard
# et utilise son propre canal vers Azure Monitor.

app.env=prod


# Connection string fournie par variable d'environnement (obligatoire)
# Format : InstrumentationKey=<uuid>;IngestionEndpoint=https://<region>.in.applicationinsights.azure.com/
applicationinsights.connection.string=${APPLICATIONINSIGHTS_CONNECTION_STRING}

logging.level.root=INFO

# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.mapping-path=/api/**