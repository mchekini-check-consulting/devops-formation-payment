# Serveur
server.port=8082

# PostgreSQL - Read/Write (même host en dev Docker)
app.datasource.write.url=jdbc:postgresql://postgres:5432/payment_db
app.datasource.read.url=jdbc:postgresql://postgres:5432/payment_db
app.datasource.username=postgres
app.datasource.password=postgres
app.datasource.driver-class-name=org.postgresql.Driver

# JPA - Dev (affiche les requêtes SQL)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging - Dev (détaillé)
logging.level.com.ecommerce.paymentservice=DEBUG
logging.level.org.springframework.web=DEBUG

# Simulation paiement (80% succès)
payment.simulation.success-probability=0.8


# CORS Configuration for Development
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.mapping-path=/api/**



app.env=dev
LOG_LEVEL=DEBUG

management.endpoints.web.exposure.include=health,info
logging.level.com.ecom=DEBUG
