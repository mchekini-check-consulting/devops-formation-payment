# Serveur
server.port=8082

# PostgreSQL - Base locale
spring.datasource.url=jdbc:postgresql://postgres:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — alignement avec PgCat (server_lifetime = 300s)
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA - Dev (affiche les requêtes SQL)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging - Dev (détaillé)
logging.level.com.ecommerce.paymentservice=DEBUG
logging.level.org.springframework.web=DEBUG

# Simulation paiement (80% succès)
payment.simulation.success-probability=0.8


# CORS Configuration for Development
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.mapping-path=/api/**




app.env=dev
LOG_LEVEL=DEBUG

management.endpoints.web.exposure.include=health,info
logging.level.com.ecom=DEBUG

