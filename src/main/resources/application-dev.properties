# Serveur
server.port=8082

# PostgreSQL - Base locale
spring.datasource.url=jdbc:postgresql://postgres:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Dev (affiche les requêtes SQL)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging - Dev (détaillé)
logging.level.com.ecommerce.paymentservice=DEBUG
logging.level.org.springframework.web=DEBUG

# Simulation paiement (80% succès)
payment.simulation.success-probability=0.8


# CORS Configuration for Development
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.mapping-path=/api/**




app.env=dev
LOG_LEVEL=DEBUG

# ─── Profil : développement local ──────────────────────────────────────────────
# L'agent opentelemetry-javaagent.jar (upstream) est attaché via JAVA_TOOL_OPTIONS
# dans docker-compose.dev.yml. Les traces sont envoyées à Jaeger (OTLP gRPC).
#
# Lancer l'environnement complet :
#   docker-compose -f docker/docker-compose.dev.yml up
# UI Jaeger : http://localhost:16686

app.env=dev

# Export OTLP vers Jaeger (conteneur "jaeger" du docker-compose.dev.yml)
otel.exporter.otlp.endpoint=http://jaeger:4317
management.opentelemetry.logging.export.otlp.endpoint=http://jaeger:4317
# Logs plus verbeux localement
logging.level.com.ecom=DEBUG

# Connection string vide en dev (l'agent AI n'est pas utilisé)
applicationinsights.connection.string=InstrumentationKey=00000000-0000-0000-0000-000000000000