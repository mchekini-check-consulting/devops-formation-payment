# CD Pipeline — GitOps (pull model)
#
# Deux modes de fonctionnement :
#   1. Automatique : push sur main → build + scan + push ACR → update tag dans le repo gitops (dev)
#   2. Manuel      : choix de l'environnement (qualif/prod) + imageTag → update tag dans le repo gitops
#
# ArgoCD détecte le changement dans le repo gitops et déploie automatiquement.
#
# Variables requises dans le groupe 'variable' :
#   GITOPS_PAT — Personal Access Token avec accès au repo devops-formation-gitops

trigger:
  branches:
    include:
    - main

pr: none

parameters:
- name: environment
  displayName: "Environnement cible (qualif/prod uniquement)"
  type: string
  default: qualif
  values:
  - qualif
  - prod

- name: imageTag
  displayName: "Tag image existant dans ACR à promouvoir"
  type: string
  default: ' '

pool:
  vmImage: ubuntu-latest

variables:
- group: variable
- name: ACR_NAME
  value: crformation
- name: IMAGE_REPO
  value: crformation.azurecr.io/devops-formation-payment
- name: GITOPS_REPO
  value: devops-formation-gitops
- name: APP_NAME
  value: payment

stages:

# =============================================================
#  DEV FLOW : Build → Docker → Trivy → Push ACR → Update GitOps
#  Déclenché automatiquement au push sur main
# =============================================================

# ─────────────────────────────────────────────
# STAGE : Build JAR
# ─────────────────────────────────────────────
- stage: Build
  displayName: 'Build'
  condition: ne(variables['Build.Reason'], 'Manual')
  jobs:
  - job: BuildJob
    displayName: 'Maven Package'
    steps:
    - task: Maven@3
      displayName: 'Maven - package -DskipTests'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package -DskipTests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - JAR'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target'
        ArtifactName: 'jar'

# ─────────────────────────────────────────────
# STAGE : Docker Build Multi-Platform (OCI)
# ─────────────────────────────────────────────
- stage: DockerBuild
  displayName: 'Docker Build Multi-Platform'
  condition: ne(variables['Build.Reason'], 'Manual')
  dependsOn: Build
  jobs:
  - job: DockerBuildJob
    displayName: 'Buildx Multi-Platform → OCI artifact'
    steps:
    - script: |
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        IMAGE_TAG="${SHORT_SHA}-main-${TIMESTAMP}"
        echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
        echo "##vso[task.setvariable variable=TIMESTAMP]$TIMESTAMP"
        echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"
        echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]$IMAGE_TAG"
        echo "Image tag: $IMAGE_TAG"
      name: setVars
      displayName: 'Set SHORT_SHA, TIMESTAMP & IMAGE_TAG'

    - task: AzureCLI@2
      displayName: 'ACR Login (for buildx cache)'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name crformation

    - script: |
        docker buildx create --use --name multiplatform
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag crformation.azurecr.io/devops-formation-payment:$(IMAGE_TAG) \
          --cache-from type=registry,ref=crformation.azurecr.io/devops-formation-payment:buildcache \
          --cache-to type=registry,ref=crformation.azurecr.io/devops-formation-payment:buildcache,mode=max \
          --output type=oci,dest=$(Build.ArtifactStagingDirectory)/image-oci.tar \
          .
      displayName: 'Docker Buildx Build → OCI tar'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - image-oci.tar'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/image-oci.tar'
        ArtifactName: 'docker-image'

# ─────────────────────────────────────────────
# STAGE : Trivy Security Scan
# ─────────────────────────────────────────────
- stage: Trivy
  displayName: 'Trivy Security Scan'
  condition: ne(variables['Build.Reason'], 'Manual')
  dependsOn: DockerBuild
  variables:
    IMAGE_TAG: $[stageDependencies.DockerBuild.DockerBuildJob.outputs['setVars.IMAGE_TAG']]
    IMAGE: crformation.azurecr.io/devops-formation-payment:$(IMAGE_TAG)
  jobs:
  - job: TrivyJob
    displayName: 'Trivy Scan'
    steps:

    - task: DownloadBuildArtifacts@1
      displayName: 'Download OCI image'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/oci-image
        tar -xf $(Build.ArtifactStagingDirectory)/docker-image/image-oci.tar \
          -C $(Build.ArtifactStagingDirectory)/oci-image
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy image \
          --input $(Build.ArtifactStagingDirectory)/oci-image \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format json \
          --output $(Build.ArtifactStagingDirectory)/trivy-report.json
        trivy image \
          --input $(Build.ArtifactStagingDirectory)/oci-image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format table
      displayName: 'Trivy - Scan (fail on HIGH/CRITICAL)'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - trivy-report.json'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy-report.json'
        ArtifactName: 'trivy-report'

# ─────────────────────────────────────────────
# STAGE : Push → ACR
# ─────────────────────────────────────────────
- stage: PushACR
  displayName: 'Push to ACR'
  condition: ne(variables['Build.Reason'], 'Manual')
  dependsOn:
  - Trivy
  - DockerBuild
  variables:
    IMAGE_TAG: $[stageDependencies.DockerBuild.DockerBuildJob.outputs['setVars.IMAGE_TAG']]
    IMAGE: crformation.azurecr.io/devops-formation-payment:$(IMAGE_TAG)
  jobs:
  - job: PushJob
    displayName: 'Push Docker Image'
    steps:

    - task: DownloadBuildArtifacts@1
      displayName: 'Download OCI image'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - task: AzureCLI@2
      displayName: 'Push OCI image → ACR'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name crformation
          skopeo copy \
            oci-archive:$(Build.ArtifactStagingDirectory)/docker-image/image-oci.tar \
            docker://$(IMAGE)

# ─────────────────────────────────────────────
# STAGE : Update GitOps repo (dev)
# ─────────────────────────────────────────────
- stage: UpdateGitopsDev
  displayName: 'Update GitOps → dev'
  condition: ne(variables['Build.Reason'], 'Manual')
  dependsOn:
  - PushACR
  - DockerBuild
  variables:
    IMAGE_TAG: $[stageDependencies.DockerBuild.DockerBuildJob.outputs['setVars.IMAGE_TAG']]
  jobs:
  - job: UpdateGitopsJob
    displayName: 'Update image tag in gitops repo'
    steps:
    - checkout: none

    - script: |
        set -e

        # Installer yq
        YQ_VERSION="4.44.1"
        sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

        # Cloner le repo gitops (GitHub)
        git clone https://$(GITOPS_PAT)@github.com/mchekini-check-consulting/$(GITOPS_REPO).git /tmp/gitops
        cd /tmp/gitops

        # Mettre à jour le tag image
        VALUES_FILE="environments/dev/40-applications/$(APP_NAME)/values.yaml"
        echo "Updating ${VALUES_FILE} → image.tag = $(IMAGE_TAG)"
        yq e -i ".image.tag = \"$(IMAGE_TAG)\"" "${VALUES_FILE}"

        # Commit & push
        git config user.email "azure-pipelines[bot]@users.noreply.github.com"
        git config user.name "Azure Pipelines"
        git add "${VALUES_FILE}"
        git commit -m "chore($(APP_NAME)): update dev image tag to $(IMAGE_TAG)"
        git push
      displayName: 'Clone gitops + yq update + push'

# =============================================================
#  QUALIF/PROD FLOW : Update GitOps (promote)
#  Déclenché manuellement via workflow_dispatch
# =============================================================

# ─────────────────────────────────────────────
# STAGE : Update GitOps repo (qualif/prod)
# ─────────────────────────────────────────────
- stage: UpdateGitopsPromote
  displayName: 'Update GitOps → ${{ parameters.environment }}'
  condition: eq(variables['Build.Reason'], 'Manual')
  jobs:
  - deployment: PromoteGitops
    displayName: 'Promote image tag → ${{ parameters.environment }}'
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - script: |
              set -e

              IMAGE_TAG="${{ parameters.imageTag }}"
              IMAGE_TAG=$(echo "$IMAGE_TAG" | xargs)

              if [ -z "$IMAGE_TAG" ]; then
                echo "##[error] Le paramètre imageTag est requis pour qualif/prod."
                exit 1
              fi

              # Installer yq
              YQ_VERSION="4.44.1"
              sudo wget -qO /usr/local/bin/yq \
                https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
              sudo chmod +x /usr/local/bin/yq

              # Cloner le repo gitops (GitHub)
              git clone https://$(GITOPS_PAT)@github.com/mchekini-check-consulting/$(GITOPS_REPO).git /tmp/gitops
              cd /tmp/gitops

              # Mettre à jour le tag image
              VALUES_FILE="environments/${{ parameters.environment }}/40-applications/$(APP_NAME)/values.yaml"
              echo "Updating ${VALUES_FILE} → image.tag = ${IMAGE_TAG}"
              yq e -i ".image.tag = \"${IMAGE_TAG}\"" "${VALUES_FILE}"

              # Commit & push
              git config user.email "azure-pipelines[bot]@users.noreply.github.com"
              git config user.name "Azure Pipelines"
              git add "${VALUES_FILE}"
              git commit -m "chore($(APP_NAME)): promote ${{ parameters.environment }} image tag to ${IMAGE_TAG}"
              git push
            displayName: 'Clone gitops + yq update + push'
