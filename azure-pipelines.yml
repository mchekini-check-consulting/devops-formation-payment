trigger:
- main

pr:
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: BuildJob
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
    steps:
    - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'verify'
        publishJUnitResults: true
        testResultsFiles: |
          **/surefire-reports/TEST-*.xml
          **/failsafe-reports/TEST-*.xml
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
        pathToSources: '$(System.DefaultWorkingDirectory)/src/main/java'
      condition: always()

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target'
        ArtifactName: 'jar'

- stage: Push
  dependsOn: Build
  jobs:
  - job: PushJob
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        artifactName: 'jar'
        downloadPath: '$(System.DefaultWorkingDirectory)/target'

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name crformation
          docker build -t crformation.azurecr.io/devops-formation-payment:$(Build.BuildId) .
          docker push crformation.azurecr.io/devops-formation-payment:$(Build.BuildId)
