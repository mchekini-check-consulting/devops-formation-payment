trigger:
- main

pr:
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

variables:
- group: variable
- name: BRANCH_SLUG
  value: $[replace(variables['Build.SourceBranchName'], '/', '-')]

stages:

# ─────────────────────────────────────────────
# STAGE 0 : Gitleaks – Secret Scanning
# ─────────────────────────────────────────────
- stage: Gitleaks
  displayName: 'Gitleaks – Secret Scanning'
  jobs:
  - job: GitleaksJob
    steps:
    - checkout: self
      fetchDepth: 0

    - task: Gitleaks@2
      inputs:
        scanlocation: '$(Build.SourcesDirectory)'
        configtype: 'custom'
        configfile: '$(Build.SourcesDirectory)/.gitleaks.toml'
        scanmode: 'all'
      displayName: 'Run Gitleaks'

# ─────────────────────────────────────────────
# STAGE : Lint (Checkstyle)
# ─────────────────────────────────────────────
- stage: Lint
  displayName: 'Lint (Checkstyle)'
  dependsOn: Gitleaks
  jobs:
  - job: LintJob
    displayName: 'Checkstyle Analysis'
    steps:
    - task: Maven@3
      displayName: 'Maven - checkstyle:check'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'checkstyle:check'
        options: '-DskipTests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - checkstyle-report'
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target/checkstyle-result.xml'
        ArtifactName: 'checkstyle-report'

# ─────────────────────────────────────────────
# STAGE 1 : Tests Unitaires
# ─────────────────────────────────────────────
- stage: UnitTests
  displayName: 'Unit Tests'
  dependsOn: Lint
  jobs:
  - job: UnitTestsJob
    displayName: 'Run Unit Tests'
    steps:
    - task: Maven@3
      displayName: 'Maven - surefire (*Test.java)'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'test'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        testRunTitle: 'Unit Tests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - surefire-reports'
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target/surefire-reports'
        ArtifactName: 'unit-test-reports'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - jacoco unit exec'
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target/jacoco-all.exec'
        ArtifactName: 'jacoco-unit-exec'

# ─────────────────────────────────────────────
# STAGE 2 : Mutation Tests (PIT)
# ─────────────────────────────────────────────
- stage: MutationTests
  displayName: 'Mutation Tests (PIT)'
  dependsOn: UnitTests
  jobs:
  - job: MutationJob
    displayName: 'PIT Mutation Coverage'
    steps:
    - task: Maven@3
      displayName: 'Maven - pitest mutationCoverage (≥70%)'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'test-compile org.pitest:pitest-maven:mutationCoverage'
        options: '-Djacoco.skip=true'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - PIT report'
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target/pit-reports'
        ArtifactName: 'pit-mutation-report'

# ─────────────────────────────────────────────
# STAGE 3 : Tests Intégration
# ─────────────────────────────────────────────
- stage: IntegrationTests
  displayName: 'Integration Tests'
  dependsOn: MutationTests
  jobs:
  - job: IntegrationTestsJob
    displayName: 'Run Integration Tests'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
    steps:
    - task: Maven@3
      displayName: 'Maven - failsafe (*IT.java)'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'verify'
        publishJUnitResults: true
        testResultsFiles: '**/failsafe-reports/TEST-*.xml'
        testRunTitle: 'Integration Tests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Coverage - JaCoCo'
      condition: always()
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
        pathToSources: '$(System.DefaultWorkingDirectory)/src/main/java'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - failsafe-reports'
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target/failsafe-reports'
        ArtifactName: 'integration-test-reports'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - jacoco HTML report'
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target/site/jacoco'
        ArtifactName: 'jacoco-coverage-report'

# ─────────────────────────────────────────────
# STAGE 3 : SonarQube
# ─────────────────────────────────────────────
- stage: Sonar
  displayName: 'SonarQube Analysis'
  dependsOn: IntegrationTests
  jobs:
  - job: SonarJob
    displayName: 'Sonar Scan'
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download jacoco report'
      inputs:
        artifactName: 'jacoco-coverage-report'
        downloadPath: '$(Pipeline.Workspace)/jacoco'

    - task: Maven@3
      displayName: 'Maven - compile + sonar:sonar'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'compile sonar:sonar'
        options: >-
          -DskipTests
          -Dsonar.host.url=$(SONAR_HOST_URL)
          -Dsonar.token=$(SONAR_TOKEN)
          -Dsonar.coverage.jacoco.xmlReportPaths=$(Pipeline.Workspace)/jacoco/jacoco-coverage-report/jacoco.xml
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

# ─────────────────────────────────────────────
# STAGE 4 : Build
# ─────────────────────────────────────────────
- stage: Build
  displayName: 'Build'
  dependsOn: Sonar
  jobs:
  - job: BuildJob
    displayName: 'Maven Package'
    steps:
    - task: Maven@3
      displayName: 'Maven - package -DskipTests'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package -DskipTests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - JAR'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target'
        ArtifactName: 'jar'

# ─────────────────────────────────────────────
# STAGE 5 : Docker Build
# ─────────────────────────────────────────────
- stage: DockerBuild
  displayName: 'Docker Build'
  dependsOn: Build
  variables:
    IMAGE: crformation.azurecr.io/devops-formation-payment:$(BRANCH_SLUG)-$(SHORT_SHA)
  jobs:
  - job: DockerBuildJob
    displayName: 'Build & Save Image'
    steps:
    - script: |
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
      displayName: 'Set SHORT_SHA'

    - task: DownloadBuildArtifacts@1
      displayName: 'Download JAR artifact'
      inputs:
        artifactName: 'jar'
        downloadPath: '$(System.DefaultWorkingDirectory)/target'

    - task: AzureCLI@2
      displayName: 'Docker Build → save tar'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name crformation
          docker build -t $(IMAGE) .
          docker save $(IMAGE) -o $(Build.ArtifactStagingDirectory)/image.tar

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - image.tar'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/image.tar'
        ArtifactName: 'docker-image'

# ─────────────────────────────────────────────
# STAGE 6 : Trivy Security Scan
# ─────────────────────────────────────────────
- stage: Trivy
  displayName: 'Trivy Security Scan'
  dependsOn: DockerBuild
  variables:
    IMAGE: crformation.azurecr.io/devops-formation-payment:$(BRANCH_SLUG)-$(SHORT_SHA)
  jobs:
  - job: TrivyJob
    displayName: 'Trivy Scan'
    steps:
    - script: |
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
      displayName: 'Set SHORT_SHA'

    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - script: docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
      displayName: 'Docker Load Image'

    - task: trivy@1
      displayName: 'Trivy - Scan (fail on HIGH/CRITICAL)'
      inputs:
        image: $(IMAGE)
        severities: 'HIGH,CRITICAL'
        exitCode: '1'

    - task: trivy@1
      displayName: 'Trivy - Export JSON Report'
      condition: always()
      inputs:
        image: $(IMAGE)
        severities: 'HIGH,CRITICAL'
        exitCode: '0'
        format: 'json'
        output: '$(Build.ArtifactStagingDirectory)/trivy-report.json'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact - trivy-report.json'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy-report.json'
        ArtifactName: 'trivy-report'

# ─────────────────────────────────────────────
# STAGE 7 : Push → ACR
# ─────────────────────────────────────────────
- stage: Push
  displayName: 'Push to ACR'
  dependsOn: Trivy
  #condition: and(succeeded(), eq(variables['Build.Reason'], 'IndividualCI'))
  variables:
    IMAGE: crformation.azurecr.io/devops-formation-payment:$(BRANCH_SLUG)-$(SHORT_SHA)
  jobs:
  - job: PushJob
    displayName: 'Push Docker Image'
    steps:
    - script: |
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
      displayName: 'Set SHORT_SHA'

    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - task: AzureCLI@2
      displayName: 'Docker Load & Push → ACR'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
          az acr login --name crformation
          docker push $(IMAGE)

# ─────────────────────────────────────────────
# STAGE 8 : Helm Push → ACR
# ─────────────────────────────────────────────
- stage: HelmPush
  displayName: 'Push Helm Chart'
  dependsOn: Push
  jobs:
  - job: HelmPushJob
    displayName: 'Package & Push Helm Chart'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Helm Package & Push → ACR'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name crformation
          helm package ./helm/payment
          helm push payment-*.tgz oci://crformation.azurecr.io/helm
